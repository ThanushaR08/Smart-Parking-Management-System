<!DOCTYPE html>
<html>

<head>

<title>Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-center">

💳 Online Payment

</h2>

<hr>

<p><b>Vehicle:</b> {{ payment.vehicle_number }}</p>

<p><b>Slot:</b> {{ payment.slot_number }}</p>

<p><b>Amount:</b> ₹{{ payment.amount }}</p>

<div class="text-center">

<img src="{{ url_for('static', filename='images/payment_qr.png') }}" width="250">

</div>

<div class="text-center mt-4">

<a href="{{ url_for('payment',status='success') }}"
class="btn btn-success">

Pay Now

</a>

</div>

</div>

</div>

</body>

</html>
