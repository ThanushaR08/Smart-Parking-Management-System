<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="overlay">

    <div class="login-box">

        <h2>Create Account</h2>
        {% with messages = get_flashed_messages() %}
{% if messages %}
<div class="alert alert-warning">
    {% for message in messages %}
        {{ message }}
    {% endfor %}
</div>
{% endif %}
{% endwith %}
        <form action="/register_user" method="POST">

            <input
                type="text"
                class="form-control mb-3"
                name="name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                class="form-control mb-3"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="tel"
                class="form-control mb-3"
                name="mobile"
                pattern="[0-9]{10}"
                maxlength="10"
                placeholder="Mobile Number"
                required>
            <select class="form-control mb-3" name="vehicle_type" required>
                <option value="">Select Vehicle</option>
                <option value="Bike">Bike</option>
                <option value="Car">Car</option>
            </select>

            <input
            type="text"
            class="form-control mb-3"
            name="vehicle_number"
            placeholder="Vehicle Number (Example: KA01AB1234)"
            style="text-transform:uppercase;"
            pattern="[A-Za-z]{2}[0-9]{2}[A-Za-z]{1,2}[0-9]{4}"
            title="Enter a valid vehicle number (Example: KA01AB1234)"
            required>

            <input
                type="password"
                class="form-control mb-3"
                name="password"
                placeholder="Password"
                required>

            <input
                type="password"
                class="form-control mb-3"
                name="confirm_password"
                placeholder="Confirm Password"
                required>

            <button class="btn btn-success w-100">
                Register
            </button>

        </form>

        <div class="text-center mt-3">

            <span class="text-white">
                Already have an account?
            </span>

            <a href="/" class="text-warning fw-bold">
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
