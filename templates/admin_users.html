<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Users</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">
<style>

body{
background:#f4f6f9;
font-family:Arial,Helvetica,sans-serif;
}

.container{
margin-top:40px;
}

.card{
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.table th{
background:#0d6efd;
color:white;
text-align:center;
}

.table td{
text-align:center;
vertical-align:middle;
}

h2{
text-align:center;
margin-bottom:25px;
font-weight:bold;
color:#0d6efd;
}

.btn{
margin:3px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="card-body">

<h2>👥 Registered Users</h2>
<form method="GET" action="{{ url_for('admin_users') }}" class="row mb-4">

    <div class="col-md-10">

        <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search by Name, Email, Mobile or Vehicle Number"
            value="{{ request.args.get('search','') }}">

    </div>

    <div class="col-md-2">

        <button class="btn btn-primary w-100">
            Search
        </button>

    </div>

</form>

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Mobile</th>

<th>Vehicle No</th>

<th>Vehicle Type</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for user in users %}

<tr>

<td>{{ user.name }}</td>

<td>{{ user.email }}</td>

<td>{{ user.mobile }}</td>

<td>{{ user.vehicle_number }}</td>

<td>{{ user.vehicle_type }}</td>

<td>

<a href="{{ url_for('delete_user', email=user.email) }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this user?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

<div class="text-center">

<a href="{{ url_for('admin_dashboard') }}"
class="btn btn-primary">

⬅ Back to Dashboard

</a>

</div>

</div>

</div>

</div>

</body>

</html>
